name: Sprint 1 checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:b7587f3cb74f4f4b2a4f9d67f052edbf95eb93f4fec7c5ada3792546caaf7383
        env:
          POSTGRES_USER: nexrun
          POSTGRES_PASSWORD: nexrun
          POSTGRES_DB: nexrun
        ports:
          - 5432:5432
        options: --health-cmd 'pg_isready -U nexrun -d nexrun' --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://nexrun:nexrun@127.0.0.1:5432/nexrun
      TEST_DATABASE_URL: postgres://nexrun:nexrun@127.0.0.1:5432/nexrun
      AGENT_MODE: mock
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
